; ESP32-DevKitC (ESP32-WROOM-32D, 4MB flash) — Relay controller over MQTT
[env:esp32dev]
platform = espressif32@6.9.0          ; Arduino-ESP32 core 2.0.17
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.partitions = default.csv  ; 2x OTA app slots (ready for future OTA)
lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.2.0
build_flags =
    ; FW_VERSION comes from CI (PLATFORMIO_BUILD_FLAGS); local builds report "1.0.0-local"
    -DCORE_DEBUG_LEVEL=1
extra_scripts = post:merge_bin.py
