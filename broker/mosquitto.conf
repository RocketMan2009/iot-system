# Mosquitto 2.x — TCP for ESP32 boards, WebSocket for the web app
per_listener_settings false
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

persistence true
persistence_location /mosquitto/data/
log_dest stdout

# ESP32 boards (PubSubClient)
listener 1883
protocol mqtt

# Browser (mqtt.js). Behind HTTPS, terminate TLS in a reverse proxy and expose wss://
listener 9001
protocol websockets
