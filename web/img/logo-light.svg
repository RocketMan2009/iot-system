<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="520" height="120" role="img" data-variant="for-light-backgrounds" aria-labelledby="t d">
  <title id="t">PlugPilot</title>
  <desc id="d">Smart plug symbol with Wi-Fi signal. ESP32 control: MQTT · Web Serial · Browser Flasher</desc>
  <style>
    svg { --plug: #2b3086; --pilot: #2563d9; --muted: #5b6480; }
    text { font-family: "IBM Plex Sans Thai", "Segoe UI", system-ui, -apple-system, sans-serif; }
    .name { font-size: 46px; font-weight: 700; letter-spacing: -.5px; }
    .plug { fill: var(--plug); }
    .pilot { fill: var(--pilot); }
    .tag { font-size: 17px; fill: var(--muted); letter-spacing: .4px; }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5aaaf0"/>
      <stop offset=".55" stop-color="#2563d9"/>
      <stop offset="1" stop-color="#2b3086"/>
    </linearGradient>
  </defs>

  <!-- symbol (same as logo-icon.svg), 96 px -->
  <g transform="translate(8 12) scale(1.5)">
    <rect width="64" height="64" rx="15" fill="url(#bg)"/>
    <g fill="none" stroke="#ffffff" stroke-width="3.2" stroke-linecap="round">
      <path d="M27.05 17.05A7 7 0 0 1 36.95 17.05"/>
      <path d="M23.51 13.51A12 12 0 0 1 40.49 13.51" opacity=".75"/>
    </g>
    <circle cx="32" cy="21.6" r="2.3" fill="#ffffff"/>
    <rect x="14.5" y="27" width="35" height="29" rx="8.5" fill="#ffffff"/>
    <circle cx="32" cy="41.5" r="9.6" fill="#dbeafe"/>
    <rect x="27.1" y="37.2" width="3.2" height="8.6" rx="1.6" fill="#2b3086"/>
    <rect x="33.7" y="37.2" width="3.2" height="8.6" rx="1.6" fill="#2b3086"/>
    <circle cx="44.6" cy="31.6" r="1.7" fill="#22c55e"/>
  </g>

  <!-- wordmark -->
  <text class="name" x="124" y="66"><tspan class="plug">Plug</tspan><tspan class="pilot">Pilot</tspan></text>
  <text class="tag" x="126" y="98">MQTT · Web Serial · Browser Flasher</text>
</svg>
